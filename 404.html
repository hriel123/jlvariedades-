<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Página não encontrada</title>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('portfolio-theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) {}
  })();
</script>
<style>
  @font-face {
    font-family: 'DM Sans';
    font-weight: 400 700;
    font-display: swap;
    src: url(/Portifolio/assets/fonts/dm-sans.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Syne';
    font-weight: 800;
    font-display: swap;
    src: url(/Portifolio/assets/fonts/syne.woff2) format('woff2');
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080b10;
    --card: #111722;
    --border: #1e2a3a;
    --accent: #00c8ff;
    --on-accent: #080b10;
    --text: #e8edf5;
    --muted: #7e8ca0;
  }

  [data-theme="light"] {
    --bg: #f4f6fa;
    --card: #ffffff;
    --border: #dde3ec;
    --accent: #0077a3;
    --on-accent: #ffffff;
    --text: #11161d;
    --muted: #525c69;
  }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  main {
    width: 100%;
    max-width: 30rem;
    padding: 2.5rem 1.75rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    text-align: center;
  }

  .codigo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 4rem;
    line-height: 1;
    color: var(--accent);
  }

  h1 {
    margin-top: 1rem;
    font-size: 1.4rem;
  }

  p { margin-top: 0.75rem; color: var(--muted); }

  .links {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-top: 2rem;
  }

  .links a {
    display: block;
    padding: 0.8rem 1rem;
    border: 1px solid var(--accent);
    border-radius: 10px;
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }

  .links a:first-child {
    background: var(--accent);
    color: var(--on-accent);
  }

  .links a:hover { text-decoration: underline; }

  .links a:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }
</style>
</head>
<body>
<main>
  <div class="codigo" aria-hidden="true">404</div>
  <h1>Página não encontrada</h1>
  <p>O endereço pode ter sido digitado errado ou a página mudou de lugar.</p>
  <nav class="links" aria-label="Para onde ir">
    <a href="/Portifolio/" id="link-portfolio">Ir para o portfólio de Hariel Silva Fabrício</a>
    <a href="/jlvariedades-/" id="link-loja">Ir para a loja JL Variedades</a>
  </nav>
</main>
<script>
  if (location.pathname.toLowerCase().indexOf('/jlvariedades-') === 0) {
    var loja = document.getElementById('link-loja');
    loja.parentNode.insertBefore(loja, loja.parentNode.firstChild);
  }
</script>
</body>
</html>
